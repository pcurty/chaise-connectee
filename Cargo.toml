[package]
name = "chaise"
version = "0.1.0"
edition = "2024"
description = "Simulated IoT smart chair streaming telemetry to Supabase"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dotenvy = "0.15"
rand = "0.10"
rand_distr = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
